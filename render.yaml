services:
  - type: web
    name: website-ban-hang-rieng
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: store-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
